name: Build LaTeX Resume

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # needed to push the compiled PDF back

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RESUME_TEX: resume.tex
      OUTPUT_PDF: Resume.pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra latexmk

      - name: Build resume
        run: |
          latexmk -pdf -pdflatex="pdflatex -interaction=nonstopmode -halt-on-error -file-line-error" "${RESUME_TEX}"
          
      - name: Upload LaTeX logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            **/*.log
            **/*.blg
            **/*.fls

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          src="${RESUME_TEX}"
          pdf="${src%.tex}.pdf"
          mv "$pdf" "docs/${OUTPUT_PDF}"

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: docs/${OUTPUT_PDF}

      - name: Commit PDF back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-build resume PDF"
          file_pattern: docs/${OUTPUT_PDF}
