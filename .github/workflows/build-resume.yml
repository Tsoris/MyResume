name: Build LaTeX Resumes

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra latexmk

      - name: Build resume variants
        run: |
          mkdir -p build docs
          latexmk -pdf -pdflatex="pdflatex -interaction=nonstopmode -halt-on-error -file-line-error" -outdir=build resumes/internship.tex
          latexmk -pdf -pdflatex="pdflatex -interaction=nonstopmode -halt-on-error -file-line-error" -outdir=build resumes/full-time.tex
          cp build/internship.pdf docs/Resume.pdf

      - name: Upload LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            build/*.log
            build/*.blg
            build/*.fls
          if-no-files-found: ignore

      - name: Upload full-time resume
        uses: actions/upload-artifact@v4
        with:
          name: full-time-resume
          path: build/full-time.pdf
          retention-days: 90

      - name: Commit public resume
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-build public resume PDF"
          file_pattern: docs/Resume.pdf
